# ── CitaYa V3 · Stack para Dokploy (aparte de V2: su propia base, procesador y rutas) ───────────────────────────
# Servicios: app (PHP/Apache y webhook de WhatsApp) + worker (cola de correo y WhatsApp) + db (MariaDB).
# Las variables ${...} se definen en Dokploy → pestaña "Environment".
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_KEY: ${APP_KEY}
      APP_MODE: ${APP_MODE:-demo}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-}
      WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-local}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_ACCOUNT_ID: ${ZERNIO_ACCOUNT_ID:-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      WHATSAPP_TEMPLATE_READY: ${WHATSAPP_TEMPLATE_READY:-}
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:-}
      N8N_SECRET: ${N8N_SECRET:-}
      N8N_EVENTS_URL: ${N8N_EVENTS_URL:-}
      WHATSAPP_DISPATCH: ${WHATSAPP_DISPATCH:-worker}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-}
      WA_SECRET: ${WA_SECRET:-}
      WHATSAPP_QR_URL: http://whatsapp-qr:3218
      PUBLIC_URL: https://${DOMAIN}
      RUN_SETUP: "1"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - dokploy-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.citayav3.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.citayav3.entrypoints=websecure
      - traefik.http.routers.citayav3.tls.certresolver=letsencrypt
      - traefik.http.services.citayav3.loadbalancer.server.port=80
      - traefik.http.routers.citayav3-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.citayav3-web.entrypoints=web
      - traefik.http.routers.citayav3-web.middlewares=citayav3-https
      - traefik.http.middlewares.citayav3-https.redirectscheme.scheme=https
      - traefik.http.middlewares.citayav3-https.redirectscheme.permanent=true

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_KEY: ${APP_KEY}
      APP_MODE: ${APP_MODE:-demo}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-local}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_ACCOUNT_ID: ${ZERNIO_ACCOUNT_ID:-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      WHATSAPP_TEMPLATE_READY: ${WHATSAPP_TEMPLATE_READY:-}
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:-}
      N8N_SECRET: ${N8N_SECRET:-}
      N8N_EVENTS_URL: ${N8N_EVENTS_URL:-}
      WHATSAPP_DISPATCH: ${WHATSAPP_DISPATCH:-worker}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-}
      WA_SECRET: ${WA_SECRET:-}
      WHATSAPP_QR_URL: http://whatsapp-qr:3218
      PUBLIC_URL: https://${DOMAIN}
      RUN_SETUP: "0"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - internal
    command: php bin/worker.php --loop

  # WhatsApp por QR (Baileys). Sin dominio ni puertos públicos: CitaYa lo usa por la red interna
  # (http://whatsapp-qr:3218) y él reenvía los mensajes a WA_WEBHOOK_URL (n8n, o /whatsapp.php de CitaYa como respaldo).
  # El QR para vincular el número se imprime en los registros de este contenedor.
  whatsapp-qr:
    build:
      context: ./tools/whatsapp-qr
    restart: unless-stopped
    environment:
      WA_SECRET: ${WA_SECRET:-}
      WA_WEBHOOK_URL: ${WA_WEBHOOK_URL:-http://app/whatsapp.php}
      WA_ALLOWED: ${WA_ALLOWED:-}
      # Opcional: número del bot para vincular con código en vez de QR (el QR se ve en el panel → WhatsApp).
      WA_PAIR_PHONE: ${WA_PAIR_PHONE:-}
    volumes:
      - whatsapp_session:/app/.session
    networks:
      - internal

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

networks:
  dokploy-network:
    external: true
  internal:

volumes:
  db_data:
  app_storage:
  whatsapp_session:
