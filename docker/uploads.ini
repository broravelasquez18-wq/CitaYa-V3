; Match application limits, with room for multipart headers above a 32 MiB batch.
upload_max_filesize = 15M
post_max_size = 40M
max_file_uploads = 20
max_execution_time = 180
max_input_time = 180
memory_limit = 256M
; PHP warnings must not corrupt JSON responses. Keep details in server logs.
display_errors = Off
display_startup_errors = Off
log_errors = On
